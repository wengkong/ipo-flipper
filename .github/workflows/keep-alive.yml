name: Keep Alive

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --silent --show-error \
               --location --max-redirs 3 \
               --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
               --max-time 60 \
               --retry 3 --retry-delay 10 \
               -o /dev/null \
               -w "Final HTTP %{http_code} in %{time_total}s (redirects: %{num_redirects})\n" \
               https://ipo-flipper.streamlit.app
