name: Keep Alive

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --silent --show-error \
               --max-time 60 \
               --retry 3 --retry-delay 10 \
               -o /dev/null \
               -w "HTTP %{http_code} in %{time_total}s\n" \
               https://ipo-flipper.streamlit.app
